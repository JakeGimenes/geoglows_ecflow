name: geoglows_ecflow
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.12,<3.14
  - pip
  # comfies' node wrappers set Variable.parent, which ecflow 5.17 made
  # read-only; pin below that until comfies is updated.
  - ecflow<5.17
  - nco
  - pyyaml
  - numpy
  - numcodecs
  - dask
  - pandas
  - fastparquet
  - xarray
  - netcdf4
  - zarr
  - boto3
  - requests
  - pip:
    - river-route>=2.1.1
